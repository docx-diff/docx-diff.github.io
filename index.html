    <script>
      // The theme before the first paint (src/ui/theme.ts keeps it up to date): the reviewer's
      // choice, else the browser's preference.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('docx-diff:theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
